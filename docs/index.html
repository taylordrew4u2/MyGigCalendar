<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEE ME LIVE – Upcoming Shows</title>

    <!-- CloudKit JS CDN -->
    <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>

    <style>
        /* ============================================================
           SEE ME LIVE — Public performer profile
           Modern minimal: hairline borders, one accent, system type.
           ============================================================ */

        :root {
            --bg: #FAFAF9;
            --surface: #FFFFFF;
            --fg: #14171C;
            --muted: #6A6F78;
            --subtle: #9CA0A8;
            --border: #E6E7EA;
            --border-strong: #D5D7DC;
            --accent: #2244D6;
            --accent-soft: #EEF1FB;
            --shadow: 0 1px 0 rgba(20, 23, 28, 0.04);
            --radius: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0E1014;
                --surface: #15181E;
                --fg: #F2F3F5;
                --muted: #A4A8B2;
                --subtle: #6F7480;
                --border: #25292F;
                --border-strong: #353A42;
                --accent: #7C9BFF;
                --accent-soft: rgba(124, 155, 255, 0.12);
                --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: inherit; }

        /* Visible focus ring for keyboard users on every interactive element. */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Masthead */
        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 36px;
        }

        .masthead .wordmark {
            font-weight: 700;
            color: var(--fg);
            letter-spacing: 0.18em;
        }

        /* Profile header */
        .profile {
            margin-bottom: 28px;
        }

        .profile h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 10px;
        }

        .profile p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            max-width: 52ch;
        }

        /* Subscribe row */
        .subscribe {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 24px 0 36px;
        }

        .subscribe[hidden] { display: none; }

        .subscribe button,
        .subscribe a {
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--fg);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .subscribe button:hover,
        .subscribe a:hover {
            border-color: var(--border-strong);
        }

        .subscribe button.is-copied {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Status messages */
        .status {
            padding: 60px 0;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
        }

        .status[hidden] { display: none; }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: -5px;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status.error { color: var(--fg); }

        /* Month group */
        .month-group + .month-group { margin-top: 28px; }

        .month-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* Show row */
        .show-row {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            align-items: start;
        }

        .show-row:last-child { border-bottom: 0; }

        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 0 6px;
            min-height: 56px;
            background: var(--surface);
        }

        .date-block .month {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .date-block .day {
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            margin-top: 2px;
            color: var(--fg);
        }

        .show-info { min-width: 0; }

        .show-info .title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            margin: 0;
            color: var(--fg);
        }

        .show-info .meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }

        .show-info .meta .sep { color: var(--subtle); }

        .show-info .role {
            margin-top: 6px;
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .show-action a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 6px 0;
            white-space: nowrap;
        }

        .show-action a:hover { text-decoration: underline; }

        .show-action a .arrow {
            font-size: 11px;
            transition: transform 0.15s ease;
        }

        .show-action a:hover .arrow { transform: translateX(2px); }

        /* Flyer thumb (only when present). Rendered as a <button> so it is
           keyboard-operable; reset the native button chrome. */
        .flyer-thumb {
            appearance: none;
            -webkit-appearance: none;
            margin-top: 12px;
            padding: 0;
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: none;
            cursor: zoom-in;
            display: block;
        }

        .flyer-thumb img {
            width: 100%;
            height: auto;
            border-radius: inherit;
            display: block;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: zoom-out;
            padding: 24px;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 6px;
        }

        /* Footer */
        .colophon {
            margin-top: 56px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .colophon a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .show-row {
                grid-template-columns: 48px 1fr;
            }
            .show-action {
                grid-column: 2;
                margin-top: 4px;
            }
        }

        /* Honour users who ask for less motion. */
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
            .subscribe button,
            .subscribe a,
            .show-action a .arrow { transition: none; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="masthead">
            <span class="wordmark">SEE ME LIVE</span>
            <span id="profileTagline">Public calendar</span>
        </header>

        <section class="profile">
            <h1 id="profileName">Upcoming shows</h1>
            <p id="profileDescription">Live performance dates and ticket links, kept up to date by the artist.</p>
        </section>

        <div class="subscribe" id="subscribe" hidden>
            <a id="appleBtn" href="#">Apple Calendar</a>
            <a id="googleBtn" href="#" target="_blank" rel="noopener">Google Calendar</a>
            <button id="copyBtn" type="button">Copy feed link</button>
        </div>

        <!-- Status region: a single live area so screen readers announce
             loading / empty / error transitions as they happen. -->
        <div class="status" id="loading" role="status">
            <span class="spinner" aria-hidden="true"></span>Loading shows…
        </div>
        <div class="status" id="empty" role="status" hidden>No upcoming shows right now. Check back soon.</div>
        <div class="status error" id="error" role="alert" hidden></div>

        <div id="shows" hidden></div>

        <footer class="colophon">
            <span id="footerName">Powered by SEE ME LIVE</span>
            <a href="#" id="aboutLink">About</a>
        </footer>
    </div>

    <script>
    "use strict";

    // ================================================================
    // Configuration
    // ================================================================

    const CLOUDKIT = {
        containerIdentifier: 'iCloud.comedy.SEE-ME-LIVE',
        // Public read-only API token — safe to ship to the browser, this is
        // exactly how CloudKit JS is designed to expose a public database.
        apiToken: '973fea23642dcde5150a44716fa5b34bc7b1d4502f37851654e926d675fe7132',
        environment: 'production',
    };
    const FEED_ORIGIN = 'https://seemelive.vercel.app';

    // Cache element references once instead of querying the DOM repeatedly.
    const els = {
        profileTagline: document.getElementById('profileTagline'),
        subscribe:      document.getElementById('subscribe'),
        appleBtn:       document.getElementById('appleBtn'),
        googleBtn:      document.getElementById('googleBtn'),
        copyBtn:        document.getElementById('copyBtn'),
        loading:        document.getElementById('loading'),
        empty:          document.getElementById('empty'),
        error:          document.getElementById('error'),
        shows:          document.getElementById('shows'),
    };

    const userID = new URLSearchParams(window.location.search).get('user');

    if (!userID) {
        showError('No user ID provided. Use a link from the SEE ME LIVE app.');
    } else {
        setupSubscribe(userID);
        loadShows(userID);
    }

    // ================================================================
    // View state — exactly one of these panels is visible at a time.
    // ================================================================

    function showOnly(visible) {
        [els.loading, els.empty, els.error, els.shows].forEach(el => {
            el.hidden = el !== visible;
        });
    }

    function showError(message) {
        els.error.textContent = message;
        showOnly(els.error);
    }

    function showEmpty() {
        showOnly(els.empty);
    }

    // ================================================================
    // Calendar subscription links
    // ================================================================

    function setupSubscribe(userID) {
        const feedURL = `${FEED_ORIGIN}/calendar.ics?user=${encodeURIComponent(userID)}`;
        const webcalURL = feedURL.replace(/^https?:/, 'webcal:');
        const googleURL = `https://calendar.google.com/calendar/u/0/r?cid=${encodeURIComponent(feedURL)}`;

        els.appleBtn.href = webcalURL;
        els.googleBtn.href = googleURL;

        els.copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(feedURL);
                flashCopied();
            } catch {
                // Clipboard can be unavailable (e.g. insecure context); fall
                // back to the feed link the buttons already expose.
            }
        });

        els.subscribe.hidden = false;
    }

    function flashCopied() {
        els.copyBtn.textContent = 'Copied';
        els.copyBtn.classList.add('is-copied');
        setTimeout(() => {
            els.copyBtn.textContent = 'Copy feed link';
            els.copyBtn.classList.remove('is-copied');
        }, 1800);
    }

    // ================================================================
    // Data loading
    // ================================================================

    async function loadShows(userID) {
        try {
            CloudKit.configure({
                containers: [{
                    containerIdentifier: CLOUDKIT.containerIdentifier,
                    apiTokenAuth: { apiToken: CLOUDKIT.apiToken, persist: false },
                    environment: CLOUDKIT.environment,
                }],
            });

            const db = CloudKit.getDefaultContainer().publicCloudDatabase;
            const response = await db.performQuery({
                recordType: 'PublicShow',
                filterBy: [{
                    fieldName: 'userID',
                    comparator: 'EQUALS',
                    fieldValue: { value: userID },
                }],
                sortBy: [{ fieldName: 'date', ascending: true }],
            });

            const now = new Date();
            const shows = (response.records || [])
                .map(recordToShow)
                .filter(show => show.date >= now)
                .sort((a, b) => a.date - b.date);

            if (shows.length === 0) {
                showEmpty();
                return;
            }

            updateTagline(shows[0]);
            renderShows(shows);
            showOnly(els.shows);
        } catch (err) {
            console.error('CloudKit error:', err);
            showError('Failed to load shows. Please try again later.');
        }
    }

    function recordToShow(record) {
        const f = record.fields || {};
        const value = (field, fallback) => (f[field] ? f[field].value : fallback);
        return {
            title:      value('title', ''),
            role:       value('role', ''),
            venue:      value('venue', ''),
            date:       f.date ? new Date(f.date.value) : new Date(),
            price:      value('price', 0),
            ticketLink: value('ticketLink', ''),
            notes:      value('notes', ''),
            flyerURL:   f.flyer ? f.flyer.value.downloadURL : null,
        };
    }

    function updateTagline(nextShow) {
        const formatted = nextShow.date.toLocaleDateString(undefined, {
            month: 'short', day: 'numeric',
        });
        els.profileTagline.textContent = `Next up · ${formatted}`;
    }

    // ================================================================
    // Rendering
    // ================================================================

    function renderShows(shows) {
        els.shows.replaceChildren();

        for (const [month, items] of groupByMonth(shows)) {
            const group = document.createElement('section');
            group.className = 'month-group';

            const label = document.createElement('h2');
            label.className = 'month-label';
            label.textContent = month;
            group.appendChild(label);

            items.forEach(show => group.appendChild(renderRow(show)));
            els.shows.appendChild(group);
        }
    }

    function groupByMonth(shows) {
        const groups = new Map();
        for (const show of shows) {
            const key = show.date.toLocaleString(undefined, { month: 'long', year: 'numeric' });
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(show);
        }
        return groups;
    }

    function renderRow(show) {
        const title = show.title || 'Untitled show';

        const row = document.createElement('article');
        row.className = 'show-row';
        row.appendChild(renderDateBlock(show.date));

        const info = document.createElement('div');
        info.className = 'show-info';
        info.appendChild(renderTitle(title));
        info.appendChild(renderMeta(show));
        if (show.role) info.appendChild(renderRole(show.role));
        if (show.flyerURL) info.appendChild(renderFlyer(show.flyerURL, title));
        row.appendChild(info);

        row.appendChild(renderAction(show.ticketLink));
        return row;
    }

    function renderDateBlock(date) {
        const block = document.createElement('div');
        block.className = 'date-block';

        const month = document.createElement('span');
        month.className = 'month';
        month.textContent = date.toLocaleString(undefined, { month: 'short' });

        const day = document.createElement('span');
        day.className = 'day';
        day.textContent = date.getDate();

        block.append(month, day);
        return block;
    }

    function renderTitle(title) {
        const el = document.createElement('h3');
        el.className = 'title';
        el.textContent = title;
        return el;
    }

    function renderMeta(show) {
        const meta = document.createElement('p');
        meta.className = 'meta';

        const time = show.date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        const dayOfWeek = show.date.toLocaleDateString(undefined, { weekday: 'short' });
        meta.appendChild(span(`${dayOfWeek}, ${time}`));

        if (show.venue) {
            meta.append(separator(), span(show.venue));
        }
        if (show.price > 0) {
            meta.append(separator(), span(`$${show.price.toFixed(2)}`));
        }
        return meta;
    }

    function renderRole(role) {
        const el = document.createElement('span');
        el.className = 'role';
        el.textContent = role;
        return el;
    }

    function renderFlyer(url, title) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'flyer-thumb';
        button.setAttribute('aria-label', `View flyer for ${title}`);

        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        button.appendChild(img);

        button.addEventListener('click', () => openLightbox(url, `${title} flyer`));
        return button;
    }

    function renderAction(ticketLink) {
        const action = document.createElement('div');
        action.className = 'show-action';
        if (!ticketLink) return action;

        const link = document.createElement('a');
        link.href = ticketLink;
        link.target = '_blank';
        link.rel = 'noopener';
        link.append('Tickets ');

        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        arrow.setAttribute('aria-hidden', 'true');
        link.appendChild(arrow);

        action.appendChild(link);
        return action;
    }

    // ----------------------------------------------------------------
    // Small DOM helpers
    // ----------------------------------------------------------------

    function span(text) {
        const el = document.createElement('span');
        el.textContent = text;
        return el;
    }

    function separator() {
        const el = span('·');
        el.className = 'sep';
        el.setAttribute('aria-hidden', 'true');
        return el;
    }

    // ================================================================
    // Lightbox — an accessible modal dialog with focus restore and
    // Escape-to-close.
    // ================================================================

    function openLightbox(url, alt) {
        const lastFocused = document.activeElement;

        const overlay = document.createElement('div');
        overlay.className = 'lightbox';
        overlay.tabIndex = -1;
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-label', alt);

        const img = document.createElement('img');
        img.src = url;
        img.alt = alt;
        overlay.appendChild(img);

        function close() {
            overlay.remove();
            document.removeEventListener('keydown', onKeydown);
            if (lastFocused instanceof HTMLElement) lastFocused.focus();
        }

        function onKeydown(event) {
            if (event.key === 'Escape') close();
        }

        overlay.addEventListener('click', close);
        document.addEventListener('keydown', onKeydown);
        document.body.appendChild(overlay);
        overlay.focus();
    }
    </script>
</body>
</html>
