<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEE ME LIVE – Upcoming Shows</title>

    <!-- CloudKit JS CDN -->
    <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>

    <style>
        /* ============================================================
           SEE ME LIVE — Public performer profile
           Modern minimal: hairline borders, one accent, system type.
           ============================================================ */

        :root {
            --bg: #FAFAF9;
            --surface: #FFFFFF;
            --fg: #14171C;
            --muted: #6A6F78;
            --subtle: #9CA0A8;
            --border: #E6E7EA;
            --border-strong: #D5D7DC;
            --accent: #2244D6;
            --accent-soft: #EEF1FB;
            --shadow: 0 1px 0 rgba(20, 23, 28, 0.04);
            --radius: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0E1014;
                --surface: #15181E;
                --fg: #F2F3F5;
                --muted: #A4A8B2;
                --subtle: #6F7480;
                --border: #25292F;
                --border-strong: #353A42;
                --accent: #7C9BFF;
                --accent-soft: rgba(124, 155, 255, 0.12);
                --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: inherit; }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Masthead */
        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 36px;
        }

        .masthead .wordmark {
            font-weight: 700;
            color: var(--fg);
            letter-spacing: 0.18em;
        }

        /* Profile header */
        .profile {
            margin-bottom: 28px;
        }

        .profile h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 0 0 10px;
        }

        .profile p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            max-width: 52ch;
        }

        /* Subscribe row */
        .subscribe {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 24px 0 36px;
        }

        .subscribe[hidden] { display: none; }

        .subscribe button,
        .subscribe a {
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--fg);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .subscribe button:hover,
        .subscribe a:hover {
            border-color: var(--border-strong);
        }

        .subscribe button.is-copied {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Status messages */
        .status {
            padding: 60px 0;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
        }

        .status[hidden] { display: none; }

        .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: -5px;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status.error { color: var(--fg); }

        /* Month group */
        .month-group + .month-group { margin-top: 28px; }

        .month-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* Show row */
        .show-row {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            align-items: start;
        }

        .show-row:last-child { border-bottom: 0; }

        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 0 6px;
            min-height: 56px;
            background: var(--surface);
        }

        .date-block .month {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .date-block .day {
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            margin-top: 2px;
            color: var(--fg);
        }

        .show-info { min-width: 0; }

        .show-info .title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            margin: 0;
            color: var(--fg);
        }

        .show-info .meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }

        .show-info .meta .sep { color: var(--subtle); }

        .show-info .role {
            margin-top: 6px;
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .show-action a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 6px 0;
            white-space: nowrap;
        }

        .show-action a:hover { text-decoration: underline; }

        .show-action a .arrow {
            font-size: 11px;
            transition: transform 0.15s ease;
        }

        .show-action a:hover .arrow { transform: translateX(2px); }

        /* Flyer thumb (only when present) */
        .flyer-thumb {
            margin-top: 12px;
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: zoom-in;
            display: block;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: zoom-out;
            padding: 24px;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 6px;
        }

        /* Footer */
        .colophon {
            margin-top: 56px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .colophon a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .show-row {
                grid-template-columns: 48px 1fr;
            }
            .show-action {
                grid-column: 2;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="masthead">
            <span class="wordmark">SEE ME LIVE</span>
            <span id="profileTagline">Public calendar</span>
        </header>

        <section class="profile">
            <h1 id="profileName">Upcoming shows</h1>
            <p id="profileDescription">Live performance dates and ticket links, kept up to date by the artist.</p>
        </section>

        <div class="subscribe" id="subscribe" hidden>
            <a id="appleBtn" href="#">Apple Calendar</a>
            <a id="googleBtn" href="#" target="_blank" rel="noopener">Google Calendar</a>
            <button id="copyBtn" type="button">Copy feed link</button>
        </div>

        <div class="status" id="loading"><span class="spinner"></span>Loading shows…</div>
        <div class="status" id="empty" hidden>No upcoming shows right now. Check back soon.</div>
        <div class="status error" id="error" hidden></div>

        <div id="shows" hidden></div>

        <footer class="colophon">
            <span id="footerName">Powered by SEE ME LIVE</span>
            <a href="#" id="aboutLink">About</a>
        </footer>
    </div>

    <script>
    // ================================================================
    // CloudKit JS Configuration
    // ================================================================

    const CONTAINER_ID  = 'iCloud.comedy.SEE-ME-LIVE';
    const API_TOKEN     = '973fea23642dcde5150a44716fa5b34bc7b1d4502f37851654e926d675fe7132';
    const ENVIRONMENT   = 'production';

    const params = new URLSearchParams(window.location.search);
    const userID = params.get('user');

    if (!userID) {
        showError('No user ID provided. Use a link from the SEE ME LIVE app.');
    } else {
        setupSubscribe(userID);
        initCloudKit();
    }

    function showError(msg) {
        document.getElementById('loading').hidden = true;
        const el = document.getElementById('error');
        el.hidden = false;
        el.textContent = msg;
    }

    function setupSubscribe(userID) {
        const feedURL    = 'https://seemelive.vercel.app/calendar.ics?user=' + encodeURIComponent(userID);
        const webcalURL  = 'webcal://seemelive.vercel.app/calendar.ics?user=' + encodeURIComponent(userID);
        const googleURL  = 'https://calendar.google.com/calendar/u/0/r?cid=' + encodeURIComponent(feedURL);

        document.getElementById('appleBtn').href = webcalURL;
        document.getElementById('googleBtn').href = googleURL;

        const copyBtn = document.getElementById('copyBtn');
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(feedURL).then(() => {
                copyBtn.textContent = 'Copied';
                copyBtn.classList.add('is-copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy feed link';
                    copyBtn.classList.remove('is-copied');
                }, 1800);
            });
        });

        document.getElementById('subscribe').hidden = false;
    }

    async function initCloudKit() {
        try {
            CloudKit.configure({
                containers: [{
                    containerIdentifier: CONTAINER_ID,
                    apiTokenAuth: { apiToken: API_TOKEN, persist: false },
                    environment: ENVIRONMENT
                }]
            });

            const container = CloudKit.getDefaultContainer();
            const db = container.publicCloudDatabase;

            const query = {
                recordType: 'PublicShow',
                filterBy: [{
                    fieldName: 'userID',
                    comparator: 'EQUALS',
                    fieldValue: { value: userID }
                }],
                sortBy: [{ fieldName: 'date', ascending: true }]
            };

            const response = await db.performQuery(query);
            document.getElementById('loading').hidden = true;

            if (!response.records || response.records.length === 0) {
                document.getElementById('empty').hidden = false;
                return;
            }

            const now = new Date();
            const shows = response.records
                .map(recordToShow)
                .filter(s => s.date >= now)
                .sort((a, b) => a.date - b.date);

            if (shows.length === 0) {
                document.getElementById('empty').hidden = false;
                return;
            }

            updateProfileSummary(shows);
            renderShows(shows);

        } catch (err) {
            console.error('CloudKit error:', err);
            showError('Failed to load shows. Please try again later.');
        }
    }

    function recordToShow(record) {
        const f = record.fields || {};
        return {
            title:      f.title      ? f.title.value      : '',
            role:       f.role       ? f.role.value       : '',
            venue:      f.venue      ? f.venue.value      : '',
            date:       f.date       ? new Date(f.date.value) : new Date(),
            price:      f.price      ? f.price.value      : 0,
            ticketLink: f.ticketLink ? f.ticketLink.value : '',
            notes:      f.notes      ? f.notes.value      : '',
            flyerURL:   f.flyer      ? f.flyer.value.downloadURL : null
        };
    }

    function updateProfileSummary(shows) {
        const next = shows[0];
        const tagline = document.getElementById('profileTagline');
        if (next) {
            const formatted = next.date.toLocaleDateString(undefined, {
                month: 'short', day: 'numeric'
            });
            tagline.textContent = `Next up · ${formatted}`;
        }
    }

    function renderShows(shows) {
        const container = document.getElementById('shows');
        container.hidden = false;
        container.innerHTML = '';

        const grouped = new Map();
        shows.forEach(show => {
            const key = show.date.toLocaleString(undefined, {
                month: 'long', year: 'numeric'
            });
            if (!grouped.has(key)) grouped.set(key, []);
            grouped.get(key).push(show);
        });

        for (const [month, items] of grouped) {
            const group = document.createElement('section');
            group.className = 'month-group';

            const label = document.createElement('h2');
            label.className = 'month-label';
            label.textContent = month;
            group.appendChild(label);

            items.forEach(show => group.appendChild(renderRow(show)));
            container.appendChild(group);
        }
    }

    function renderRow(show) {
        const row = document.createElement('article');
        row.className = 'show-row';

        // Date block
        const date = document.createElement('div');
        date.className = 'date-block';
        const month = document.createElement('span');
        month.className = 'month';
        month.textContent = show.date.toLocaleString(undefined, { month: 'short' });
        const day = document.createElement('span');
        day.className = 'day';
        day.textContent = show.date.getDate();
        date.appendChild(month);
        date.appendChild(day);
        row.appendChild(date);

        // Info column
        const info = document.createElement('div');
        info.className = 'show-info';

        const title = document.createElement('h3');
        title.className = 'title';
        title.textContent = show.title || 'Untitled show';
        info.appendChild(title);

        const meta = document.createElement('p');
        meta.className = 'meta';
        const time = show.date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        const dayOfWeek = show.date.toLocaleDateString(undefined, { weekday: 'short' });
        meta.appendChild(textNode(`${dayOfWeek}, ${time}`));
        if (show.venue) {
            meta.appendChild(separator());
            meta.appendChild(textNode(show.venue));
        }
        if (show.price > 0) {
            meta.appendChild(separator());
            meta.appendChild(textNode('$' + show.price.toFixed(2)));
        }
        info.appendChild(meta);

        if (show.role) {
            const role = document.createElement('span');
            role.className = 'role';
            role.textContent = show.role;
            info.appendChild(role);
        }

        if (show.flyerURL) {
            const img = document.createElement('img');
            img.className = 'flyer-thumb';
            img.src = show.flyerURL;
            img.alt = (show.title || 'Show') + ' flyer';
            img.loading = 'lazy';
            img.addEventListener('click', () => openLightbox(show.flyerURL));
            info.appendChild(img);
        }

        row.appendChild(info);

        // Action column
        const action = document.createElement('div');
        action.className = 'show-action';
        if (show.ticketLink) {
            const link = document.createElement('a');
            link.href = show.ticketLink;
            link.target = '_blank';
            link.rel = 'noopener';
            link.innerHTML = 'Tickets <span class="arrow">→</span>';
            action.appendChild(link);
        }
        row.appendChild(action);

        return row;
    }

    function textNode(text) {
        const span = document.createElement('span');
        span.textContent = text;
        return span;
    }

    function separator() {
        const s = document.createElement('span');
        s.className = 'sep';
        s.textContent = '·';
        return s;
    }

    function openLightbox(url) {
        const lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.addEventListener('click', () => lb.remove());
        const img = document.createElement('img');
        img.src = url;
        lb.appendChild(img);
        document.body.appendChild(lb);
    }
    </script>
</body>
</html>
